# FormFlow Lite — test + security gate (Testing Protocol v2 nets + CLASS-007)
#
# Realistic scope: the property (net 6) and contract (net 7) suites are PURE PHP
# and need no WordPress boot, so they are the blocking gate. The CLASS-007 static
# foot-gun gate (semgrep) and dependency audits (net 2) are blocking.
name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Public host floor. The locked PHPUnit graph begins at PHP 8.1, so this lane
  # deliberately avoids development dependency resolution and proves the exact
  # PHP 8.0 parser plus the cross-file runtime declaration contract.
  php-runtime-minimum:
    name: PHP 8.0 runtime declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.0"
          coverage: none
      - name: Verify PHP 8.0 runtime declarations
        run: php scripts/verify-php-runtime.php --expect-runtime=8.0
      - name: Parse every tracked PHP file on PHP 8.0
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

  # Exact development floor. Its display name intentionally matches the
  # repository's required context, replacing the impossible unsuffixed matrix
  # expectation with a real blocking job rather than a protection bypass.
  php-development-minimum:
    name: Net 6 + 7 — property & contract (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.1"
          extensions: xml
          tools: composer
      - name: Install locked dependencies at the development floor
        run: composer install --no-interaction --prefer-dist
      - name: Verify PHP 8.1 development declarations
        run: php scripts/verify-php-runtime.php --expect-development-runtime=8.1
      - name: Property tests (net 6)
        run: vendor/bin/phpunit -c phpunit.property.xml
      - name: Contract tests (net 7)
        run: vendor/bin/phpunit -c phpunit.contract.xml
      - name: Reliability tests (schema-drift + upgrade + Pro-table guards)
        run: vendor/bin/phpunit -c phpunit.reliability.xml
      - name: Unit tests (mock harness)
        run: vendor/bin/phpunit --testsuite unit

  static-footguns:
    name: CLASS-007 static foot-gun gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install semgrep
        run: pip install semgrep

      - name: Run CLASS-007 PHP foot-gun rule (blocking)
        run: semgrep --config .peanut/static-rules/peanut-php-footguns.yml includes/ --error

  security:
    name: Net 2 — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: composer audit (blocking)
        # Was `|| true` with "ratchet to blocking once the tree is clean".
        # The tree is clean — `composer audit --locked` reports no advisories —
        # so the ratchet turns here rather than staying a permanent maybe.
        run: bash scripts/run-dependency-audit-transport.sh composer

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked Python auditor
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit-venv"
          "$RUNNER_TEMP/dependency-audit-venv/bin/python" -m pip install \
            --require-hashes \
            --no-deps \
            -r requirements-dependency-audit.lock

      - name: Validate dependency-audit transport contract
        run: |
          bash scripts/tests/dependency-audit-transport.test.sh
          bash scripts/tests/dependency-audit-workflow.test.sh
          bash scripts/tests/composer-npm-audit-transport.test.sh
          bash scripts/tests/composer-npm-audit-workflow.test.sh
          bash scripts/tests/wp-contract-image-pins.test.sh

      - name: Audit the locked Python auditor
        run: |
          bash "$GITHUB_WORKSPACE/scripts/run-pip-audit.sh" "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" -r requirements-dependency-audit.lock --no-deps --disable-pip

      - name: Audit the locked platform validator
        run: |
          bash "$GITHUB_WORKSPACE/scripts/run-pip-audit.sh" "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" -r .peanut/platform/requirements.lock --no-deps --disable-pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # Blocking at MODERATE, not high. npm grades real XSS findings
      # "moderate" (e.g. GHSA-55q2-fjhq-7xh7, dompurify), and a high gate
      # exits 0 on them — verified by execution against a vulnerable pin.
      # The tree audits clean at moderate today, so this holds the line
      # instead of only appearing to.
      - name: npm audit (blocking, moderate)
        working-directory: frontend
        run: bash ../scripts/run-dependency-audit-transport.sh npm

  php-tests:
    name: Net 6 + 7 — current property & contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php-version: [ "8.2", "8.3" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xml
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Property tests (net 6)
        run: vendor/bin/phpunit -c phpunit.property.xml

      - name: Contract tests (net 7)
        run: vendor/bin/phpunit -c phpunit.contract.xml

      - name: Reliability tests (schema-drift + upgrade + Pro-table guards)
        run: vendor/bin/phpunit -c phpunit.reliability.xml

      # Blocking. This suite was DEAD until 2026-07-19: every test in it errored
      # on an undefined reset_mock_data(), and because no job ran it, that went
      # unnoticed indefinitely. Running it is the only thing that keeps it honest.
      - name: Unit tests (mock harness)
        run: vendor/bin/phpunit --testsuite unit

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nothing published. It proves the artifact the publisher WOULD build is
      # coherent -- version constants that agree with the header, every INCLUDE
      # path present, vendor/ shipped where the build needs it, a changelog
      # entry for this version, and a stable-tag line the publisher's bump can
      # actually match.
      #
      # The checker is synced here from peanut-meta by configs-sync, so this job
      # needs no credential to reach that private repo. Drift is reported by
      # configs-sync and surfaced in the weekly audit. PAR-406.
      - name: Could this be released at all?
        run: bash .peanut/release/verify-release-readiness.sh formflow-lite

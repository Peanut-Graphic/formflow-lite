# FormFlow Lite — test + security gate (Testing Protocol v2 nets + CLASS-007)
#
# Realistic scope: the property (net 6) and contract (net 7) suites are PURE PHP
# and need no WordPress boot, so they are the blocking gate. The CLASS-007 static
# foot-gun gate (semgrep) is also blocking. composer audit (net 2) runs
# non-blocking for now and is wired to ratchet to blocking later.
name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Public host floor. The locked PHPUnit graph begins at PHP 8.1, so this lane
  # deliberately avoids development dependency resolution and proves the exact
  # PHP 8.0 parser plus the cross-file runtime declaration contract.
  php-runtime-minimum:
    name: PHP 8.0 runtime declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          coverage: none
      - name: Verify PHP 8.0 runtime declarations
        run: php scripts/verify-php-runtime.php --expect-runtime=8.0
      - name: Parse every tracked PHP file on PHP 8.0
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

  # Exact development floor. Its display name intentionally matches the
  # repository's required context, replacing the impossible unsuffixed matrix
  # expectation with a real blocking job rather than a protection bypass.
  php-development-minimum:
    name: Net 6 + 7 — property & contract (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: xml
          tools: composer
      - name: Install locked dependencies at the development floor
        run: composer install --no-interaction --prefer-dist
      - name: Verify PHP 8.1 development declarations
        run: php scripts/verify-php-runtime.php --expect-development-runtime=8.1
      - name: Property tests (net 6)
        run: vendor/bin/phpunit -c phpunit.property.xml
      - name: Contract tests (net 7)
        run: vendor/bin/phpunit -c phpunit.contract.xml
      - name: Reliability tests (schema-drift + upgrade + Pro-table guards)
        run: vendor/bin/phpunit -c phpunit.reliability.xml
      - name: Unit tests (mock harness)
        run: vendor/bin/phpunit --testsuite unit

  static-footguns:
    name: CLASS-007 static foot-gun gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install semgrep
        run: pip install semgrep

      - name: Run CLASS-007 PHP foot-gun rule (blocking)
        run: semgrep --config .peanut/static-rules/peanut-php-footguns.yml includes/ --error

  security:
    name: Net 2 — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: composer audit (blocking)
        # Was `|| true` with "ratchet to blocking once the tree is clean".
        # The tree is clean — `composer audit --locked` reports no advisories —
        # so the ratchet turns here rather than staying a permanent maybe.
        run: composer audit --no-interaction

      # There was no npm gate at all, and the frontend is where the advisories
      # actually were: four open, one critical, none of which CI could ever
      # have reported. Only the Dependabot alert feed knew. Blocking at
      # `high`, matching the level the rest of the fleet gates at.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: npm audit (blocking, high)
        working-directory: frontend
        run: npm audit --audit-level=high

  php-tests:
    name: Net 6 + 7 — current property & contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php-version: [ "8.2", "8.3" ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xml
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Property tests (net 6)
        run: vendor/bin/phpunit -c phpunit.property.xml

      - name: Contract tests (net 7)
        run: vendor/bin/phpunit -c phpunit.contract.xml

      - name: Reliability tests (schema-drift + upgrade + Pro-table guards)
        run: vendor/bin/phpunit -c phpunit.reliability.xml

      # Blocking. This suite was DEAD until 2026-07-19: every test in it errored
      # on an undefined reset_mock_data(), and because no job ran it, that went
      # unnoticed indefinitely. Running it is the only thing that keeps it honest.
      - name: Unit tests (mock harness)
        run: vendor/bin/phpunit --testsuite unit

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Could this be released AT ALL? Read-only: no signing key, no network,
      # nothing published. It proves the artifact the publisher WOULD build is
      # coherent -- version constants that agree with the header, every INCLUDE
      # path present, vendor/ shipped where the build needs it, a changelog
      # entry for this version, and a stable-tag line the publisher's bump can
      # actually match.
      #
      # The checker is synced here from peanut-meta by configs-sync, so this job
      # needs no credential to reach that private repo. Drift is reported by
      # configs-sync and surfaced in the weekly audit. PAR-406.
      - name: Could this be released at all?
        run: bash .peanut/release/verify-release-readiness.sh formflow-lite

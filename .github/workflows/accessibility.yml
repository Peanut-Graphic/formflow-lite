name: Accessibility

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node/npm contract
        run: test "$(npm --version)" = "10.9.7" && npm run runtime:verify

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint with jsx-a11y
        run: |
          npm run lint:a11y -- \
            --pass-on-unpruned-suppressions \
            --rule 'jsx-a11y/alt-text: warn' \
            --rule 'jsx-a11y/anchor-has-content: warn' \
            --rule 'jsx-a11y/aria-props: error' \
            --rule 'jsx-a11y/aria-role: error' \
            --rule 'jsx-a11y/role-has-required-aria-props: error' \
            --rule 'jsx-a11y/label-has-associated-control: error' \
            --rule 'jsx-a11y/click-events-have-key-events: warn' \
            --rule 'jsx-a11y/no-static-element-interactions: warn'

      - name: Run accessibility tests
        run: npx vitest run --reporter=verbose -- a11y

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Require non-empty production artifact
        run: test -s ../assets/dist/js/main.js && test -s ../assets/dist/css/main.css

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-test-results
          path: coverage/
          retention-days: 30
